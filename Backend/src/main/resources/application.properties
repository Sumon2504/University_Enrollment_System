spring.application.name=uams
server.port=${SERVER_PORT:8082}

# MySQL Workbench manages the MySQL server used by this application.
# Override DB_URL, DB_USERNAME, and DB_PASSWORD when your local credentials differ.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/university_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
server.error.include-message=never
