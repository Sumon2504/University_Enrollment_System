spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/university_db_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
